<style>

  --ink: #18201C;

}

    --paper: #121614; --surface: #1A201D; --sunk: #202724; --ink: #E7ECE8; --ink-2: #C4CCC7; --muted: #9BA6A0;

  }
}
:root[data-theme="dark"] {
  --paper: #121614; --surface: #1A201D; --sunk: #202724; --ink: #E7ECE8; --ink-2: #C4CCC7; --muted: #9BA6A0;

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: var(--s0); line-height: 1.65; }
a { color: var(--them); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 28px 28px 64px; display: grid; gap: 24px; }
header.top { display: grid; gap: 6px; }
.eyebrow { font-size: var(--s-1); letter-spacing: .08em; color: var(--muted); }

.asof { color: var(--muted); font-size: var(--s-1); }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* 次の試合 */
.next { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 20px; }
.next .when { display: grid; gap: 2px; }
.next .when .d { font-family: var(--mono); font-size: var(--s3); font-weight: 600; line-height: 1.1; }
.next .when .v { color: var(--muted); font-size: var(--s-1); }
.next .card { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.next .card .vs { color: var(--muted); }
.next .card .t { font-family: var(--display); font-size: var(--s2); }
.next .card .t.us { color: var(--us); }
.next .card .mno { font-family: var(--mono); color: var(--muted); font-size: var(--s-1); }
.next .gauge { text-align: right; }
.next .gauge .p { font-family: var(--mono); font-size: var(--s3); font-weight: 600; color: var(--us); line-height: 1.1; }
.next .gauge .l { font-size: var(--s-1); color: var(--muted); }

/* レイアウト */
.grid { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px; align-items: start; }
aside.side { position: sticky; top: 16px; display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px; display: grid; gap: 14px; }
.panel.flat { background: transparent; border: 0; padding: 0; }
.hint { font-size: var(--s-1); color: var(--muted); margin: 0; }

/* トーナメント表 */
svg.bracket { width: 100%; height: auto; display: block; }
svg.bracket text { font-family: var(--body); fill: var(--ink); }
svg.bracket .ln { stroke: var(--line); stroke-width: 1.6; fill: none; stroke-linecap: square; }
svg.bracket .ln.win { stroke: var(--win); stroke-width: 3; }
svg.bracket .mlab { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
svg.bracket .mno { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-2); font-weight: 600; }
svg.bracket .score { font-family: var(--mono); font-size: 11px; fill: var(--win); font-weight: 600; }
svg.bracket .slot { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
svg.bracket .nm { font-size: 13.5px; font-weight: 700; }
svg.bracket .sub { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
svg.bracket .row { cursor: pointer; }
svg.bracket .row rect.hit { fill: transparent; }
svg.bracket .row:hover rect.hit { fill: var(--sunk); }
svg.bracket .row.sel rect.hit { fill: var(--them-soft); }
svg.bracket .row.me rect.hit { fill: var(--us-soft); }
svg.bracket .row.me .nm { fill: var(--us); }
svg.bracket .row.out .nm { fill: var(--muted); font-weight: 400; }
svg.bracket .row:focus { outline: none; }
svg.bracket .row:focus-visible rect.hit { stroke: var(--focus); stroke-width: 2; }
svg.bracket .dest { font-family: var(--display); font-size: 14px; fill: var(--ink); }
.sched { display: grid; gap: 0; font-size: var(--s-1); }
.sched .r { display: grid; grid-template-columns: 52px 74px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--rule); align-items: baseline; }
.sched .r:first-child { border-top: 0; }
.sched .r .m { font-family: var(--mono); color: var(--muted); }
.sched .r .dt { font-family: var(--mono); }
.sched .r.mine .card { font-weight: 700; }
.sched .r .done { color: var(--win); font-family: var(--mono); }

/* 学校カルテ */
.team-head { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: end; }
.team-head .nm { font-family: var(--display); font-size: var(--s4); line-height: 1.1; }
.team-head .meta { color: var(--muted); font-size: var(--s-1); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--s-1); padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sunk); color: var(--ink); white-space: nowrap; }
.chip.next { background: var(--them); border-color: var(--them); color: var(--surface); }
.chip.me { background: var(--us); border-color: var(--us); color: var(--surface); }
.chip.out { color: var(--muted); }
.lead { margin: 0; max-width: 68ch; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.stats > div { padding: 12px 16px; display: grid; gap: 2px; border-left: 1px solid var(--rule); }
.stats > div:first-child { border-left: 0; }
.stats .k { font-size: var(--s-1); color: var(--muted); }
.stats .v { font-family: var(--mono); font-size: var(--s3); font-weight: 600; line-height: 1.15; }
.stats .v small { font-size: var(--s-1); font-weight: 400; color: var(--muted); margin-left: 4px; }
.stats .v.us { color: var(--us); }
.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.figure { display: grid; gap: 8px; }
.figure .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; font-size: var(--s-1); color: var(--ink-2); flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg#outlook { max-width: 820px; }
svg.chart text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
svg.chart .grid line { stroke: var(--rule); stroke-width: 1; }
svg.chart .axis-lab { fill: var(--muted); }
svg.chart .val { fill: var(--ink); font-weight: 600; }
svg.chart .nmlab { font-family: var(--body); font-size: 12px; fill: var(--ink-2); font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: var(--s0); }
.kv dt { color: var(--muted); }

.tablebox { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: var(--s-1); }
th, td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--rule); vertical-align: top; }
thead th { border-top: 0; background: var(--sunk); color: var(--ink-2); font-weight: 700; white-space: nowrap; position: sticky; top: 0; }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.path { color: var(--ink-2); min-width: 280px; }
.res { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.res.w::before { content: "○ "; }
.res.l { color: var(--muted); }
.res.l::before { content: "● "; }
.res.pkw::before { content: "△ "; }
.res.pkl { color: var(--muted); }
.res.pkl::before { content: "▲ "; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }

.compare .row.h { border-top: 0; color: var(--muted); padding-top: 0; }
.compare .row .us { color: var(--us); }
.compare .row .them { color: var(--them); }
.empty { color: var(--muted); font-size: var(--s-1); margin: 0; }
section.block { display: grid; gap: 14px; }
.league { display: grid; gap: 10px; }
.league-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.league-head .pos { font-family: var(--mono); font-weight: 600; }
.league-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

.form { display: flex; gap: 4px; flex-wrap: wrap; }

.method { margin: 0; padding-left: 1.2em; max-width: 90ch; color: var(--ink-2); display: grid; gap: 6px; }

/* 強さの点数の推移（2本の折れ線） */
function eloChart(k) {
  const W = 520, H = 230, L = 46, R = 96, TOP = 16, BOT = 30;
  const years = ["2022", "2023", "2024", "2025", "2026"];
  const series = [{ k: ME, col: "var(--us)" }]; if (k !== ME) series.push({ k, col: "var(--them)" });
  const vals = series.flatMap((sr) => years.map((y) => T[sr.k].eloHistory[y]).filter((v) => v != null));
  let lo = Math.floor((Math.min(...vals, 1500) - 40) / 50) * 50, hi = Math.ceil((Math.max(...vals, 1500) + 40) / 50) * 50;
  const x = (i) => L + i * (W - L - R) / (years.length - 1), y = (v) => TOP + (hi - v) * (H - TOP - BOT) / (hi - lo);
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "強さの点数の推移" });
  const g = s("g", { class: "grid" });
  for (let v = lo; v <= hi; v += 50) { g.append(s("line", { x1: L, x2: W - R, y1: y(v), y2: y(v) })); svg.append(s("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end", class: "axis-lab" }, v)); }
  svg.append(g);
  svg.append(s("line", { x1: L, x2: W - R, y1: y(1500), y2: y(1500), stroke: "var(--muted)", "stroke-dasharray": "3 4", "stroke-width": 1 }));
  svg.append(s("text", { x: W - R + 6, y: y(1500) + 4 }, "平均1500"));
  years.forEach((yr, i) => svg.append(s("text", { x: x(i), y: H - 8, "text-anchor": "middle", class: "axis-lab" }, yr + "年度")));
  const ends = [];
  for (const sr of series) {
    const pts = years.map((yr, i) => [x(i), T[sr.k].eloHistory[yr]]).filter((p) => p[1] != null).map(([px, v]) => [px, y(v), v]);
    svg.append(s("polyline", { points: pts.map((p) => p[0] + "," + p[1]).join(" "), fill: "none", stroke: sr.col, "stroke-width": 2, "stroke-linejoin": "round" }));
    pts.forEach((p, i) => svg.append(s("circle", { cx: p[0], cy: p[1], r: i === pts.length - 1 ? 4.5 : 3, fill: sr.col, stroke: "var(--surface)", "stroke-width": 2 })));
    const last = pts[pts.length - 1]; ends.push({ y: last[1], v: last[2], k: sr.k, col: sr.col });
  }
  ends.sort((a, b) => a.y - b.y); if (ends.length === 2 && ends[1].y - ends[0].y < 30) { const m = (ends[0].y + ends[1].y) / 2; ends[0].y = m - 15; ends[1].y = m + 15; }
  for (const e of ends) { svg.append(s("text", { x: W - R + 10, y: e.y - 2, class: "nmlab" }, name(e.k))); svg.append(s("text", { x: W - R + 10, y: e.y + 12, class: "val" }, e.v)); }
  const cross = s("line", { y1: TOP, y2: H - BOT, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" }); svg.append(cross);
  const hit = s("rect", { x: L, y: TOP, width: W - L - R, height: H - TOP - BOT, fill: "transparent" });
  hit.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(years.length - 1, Math.round((px - L) / ((W - L - R) / (years.length - 1)))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    showTip(ev, `${years[i]}年度末<br>` + series.map((sr) => `${name(sr.k)} <b>${T[sr.k].eloHistory[years[i]] ?? "―"}</b>`).join("<br>"));
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  svg.append(hit);
  return svg;
}
