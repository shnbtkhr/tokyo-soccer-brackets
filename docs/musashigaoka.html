<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>武蔵丘 自己分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 武蔵丘スカウト — サイト共通の見た目
   比率はすべて黄金比 φ = 1.618 から取る。
   - 文字: 基準 15px に √φ（≈1.272）を掛けた段 … 12 / 15 / 19 / 24 / 31 / 39 / 50
   - 余白: φ で増える段 … 5 / 8 / 13 / 21 / 34 / 55 / 89
   - 配置: 本文列 : 脇列 = φ : 1（61.8% : 38.2%）
   人間工学: 本文は1行 約36字（日本語で読みやすい幅）、押せるものは高さ 44px 以上、行間 1.75。 */

/* 色: 武蔵丘のチームカラー（1st エンジ・紺／2nd 白・紺）。白地に紺の文字、武蔵丘はエンジ。
   相手校は青緑（エンジ・紺のどちらとも区別できる色。色覚の違いへの配慮は検証済み）。
   公式トーナメント表と同じく、勝ち上がりは赤線。 */
:root {
  --ground: #F5F6F8;
  --surface: #FFFFFF;
  --sunk: #ECEEF3;
  --ink: #15213B;
  --ink-2: #34405A;
  --muted: #5A657A;
  --rule: #DDE1E8;
  --rule-strong: #C4CAD5;
  --us: #9A2034;
  --us-soft: #F6E6E9;
  --us-ink: #FFFFFF;
  --them: #00809A;
  --them-soft: #E0F2F5;
  --link: #006B80;
  --line: #15213B;
  --win: #D8392B;
  --focus: #006B80;

  --f-ja: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  --f-num: "Barlow Semi Condensed", "Zen Kaku Gothic New", "Arial Narrow", sans-serif;

  --t-1: 12px; --t0: 15px; --t1: 19px; --t2: 24px; --t3: 31px; --t4: 39px; --t5: 50px;
  --s1: 5px; --s2: 8px; --s3: 13px; --s4: 21px; --s5: 34px; --s6: 55px; --s7: 89px;
  --r: 8px;
  --measure: 36em;
  --page: 1180px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E131C; --surface: #141B26; --sunk: #1B2431; --ink: #E9ECF2; --ink-2: #C3C9D5; --muted: #939CAD;
    --rule: #283243; --rule-strong: #384458; --us: #D25A6C; --us-soft: #33171E; --us-ink: #140608;
    --them: #2FA3AD; --them-soft: #10292E; --link: #5CC2CB; --line: #C9CFDA; --win: #FF6B5E; --focus: #5CC2CB;
  }
}
:root[data-theme="dark"] {
  --ground: #0E131C; --surface: #141B26; --sunk: #1B2431; --ink: #E9ECF2; --ink-2: #C3C9D5; --muted: #939CAD;
  --rule: #283243; --rule-strong: #384458; --us: #D25A6C; --us-soft: #33171E; --us-ink: #140608;
  --them: #2FA3AD; --them-soft: #10292E; --link: #5CC2CB; --line: #C9CFDA; --win: #FF6B5E; --focus: #5CC2CB;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--f-ja); font-size: var(--t0); line-height: 1.75; font-weight: 400;
  font-feature-settings: "palt" 0; -webkit-font-smoothing: antialiased;
}
a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; font-weight: 700; letter-spacing: .01em; }
h1 { font-size: var(--t4); font-weight: 900; letter-spacing: .02em; line-height: 1.15; }
h2 { font-size: var(--t2); }
h3 { font-size: var(--t1); }
p { margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums lining-nums; letter-spacing: .01em; }
.eyebrow { font-family: var(--f-num); font-size: var(--t-1); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: var(--t-1); line-height: 1.6; }
.prose { max-width: var(--measure); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ヘッダー（全ページ共通のナビゲーション） */
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--rule); }
.topbar .in { max-width: 1440px; margin: 0 auto; padding-inline: var(--s4); min-height: 55px; display: flex; align-items: center; gap: var(--s4); }
.brand { display: flex; align-items: baseline; gap: var(--s2); text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand b { font-weight: 900; font-size: var(--t1); letter-spacing: .02em; }
.brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--us); display: inline-block; transform: translateY(-2px); }
.brand span { font-family: var(--f-num); font-size: var(--t-1); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
/* 広い画面では折り返して全部見せる（横に隠さない）。狭い画面だけ横スクロールにし、スクロールバーを見せる */
nav.pages { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s1); margin-left: auto; padding-block: var(--s2); min-width: 0; }
nav.pages .grp { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sunk); }
nav.pages .grp > .lab { font-family: var(--f-num); font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); padding-inline: var(--s2) var(--s1); white-space: nowrap; }
nav.pages a { display: inline-flex; align-items: center; min-height: 36px; padding-inline: var(--s3); border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
nav.pages a:hover { background: var(--surface); color: var(--ink); }
nav.pages a[aria-current="page"] { background: var(--ink); color: var(--ground); }
nav.pages a.me[aria-current="page"] { background: var(--us); color: var(--us-ink); }
nav.pages a.out { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

/* 左のサイドパネル（PC）。上段 = サイトの地図（ツリー）、下段 = このページの見出し（読んでいる所が光る）。
   幅は 1100px 以上で出し、そのときは上のタブを隠す。スマホは上のタブのまま */
.sidenav { display: none; }
@media (min-width: 1100px) {
  :root { --side: 272px; }
  body.has-side { padding-left: var(--side); }
  body.has-side .topbar { display: none; }
  .sidenav { display: flex; flex-direction: column; gap: var(--s4); position: fixed; inset: 0 auto 0 0; width: var(--side); z-index: 25; overflow-y: auto; overscroll-behavior: contain;
    padding: var(--s4) var(--s3) var(--s4) var(--s4); background: var(--surface); border-right: 1px solid var(--rule); scrollbar-width: thin; scrollbar-color: var(--rule-strong) transparent; }
  main.page { padding-top: var(--s4); }
}
.sn-brand { display: flex; align-items: center; gap: var(--s2); text-decoration: none; color: var(--ink); padding: var(--s1) var(--s2); }
.sn-brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--us); box-shadow: 0 0 0 4px var(--us-soft); flex: none; }
.sn-brand span { display: grid; line-height: 1.3; }
.sn-brand b { font-weight: 900; font-size: var(--t1); letter-spacing: .02em; }
.sn-brand small { font-size: 11px; color: var(--muted); }
.sn-tree { display: grid; gap: var(--s2); }
.sn-grp > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: var(--s2); padding: 6px var(--s2); border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.sn-grp > summary::-webkit-details-marker { display: none; }
.sn-grp > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg) translateY(-1px); transition: transform .15s; }
.sn-grp[open] > summary::before { transform: rotate(45deg) translateY(-2px); }
.sn-grp > summary small { font-weight: 500; letter-spacing: 0; margin-left: auto; }
.sn-grp > summary:hover { color: var(--ink); }
.sn-tree ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; }
.sn-tree .sn-round { margin-top: 6px; }
.sn-tree .sn-lab { display: block; font-size: 11px; color: var(--muted); padding: 2px var(--s2) 2px 14px; }
.sn-tree .sn-round ul { margin-left: 14px; padding-left: 8px; border-left: 1px solid var(--rule); }
.sn-link { display: flex; align-items: center; gap: var(--s2); min-height: 36px; padding: 0 var(--s2) 0 var(--s3); border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 500; position: relative; transition: background .12s, color .12s; }
.sn-link:hover { background: var(--sunk); color: var(--ink); }
.sn-link .sn-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sn-link .sn-m { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--sunk); border-radius: 999px; padding: 1px 7px; }
.sn-link[aria-current="page"] { background: var(--ink); color: var(--ground); font-weight: 700; }
.sn-link[aria-current="page"] .sn-m { background: color-mix(in srgb, var(--ground) 18%, transparent); color: var(--ground); }
.sn-link.me { color: var(--us); font-weight: 700; }
.sn-link.me[aria-current="page"] { background: var(--us); color: var(--us-ink); }
.sn-toc { display: grid; gap: var(--s1); padding-top: var(--s3); border-top: 1px solid var(--rule); }
.sn-h { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); padding: 0 var(--s2) var(--s1); }
.sn-toc ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; }
.sn-toc li > a { display: block; padding: 5px var(--s2) 5px var(--s4); border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 13px; line-height: 1.45; position: relative; }
.sn-toc li > a::before { content: ""; position: absolute; left: 9px; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--rule-strong); transform: translateY(-50%); transition: background .15s, transform .15s; }
.sn-toc li > a:hover { background: var(--sunk); color: var(--ink); }
.sn-toc li.on > a { color: var(--ink); font-weight: 700; background: var(--them-soft); }
.sn-toc li.on > a::before { background: var(--them); transform: translateY(-50%) scale(1.5); }
.sn-sub { margin: 2px 0 4px var(--s4); }
.sn-sub > summary { cursor: pointer; font-size: 12px; color: var(--link); padding: 3px var(--s2); list-style: none; }
.sn-sub > summary::-webkit-details-marker { display: none; }
.sn-sub ol { max-height: 320px; overflow-y: auto; padding-left: var(--s2); border-left: 1px solid var(--rule); scrollbar-width: thin; }
.sn-sub li a { display: flex; gap: 6px; padding: 3px var(--s2); font-size: 12.5px; color: var(--ink-2); text-decoration: none; border-radius: 5px; }
.sn-sub li a:hover { background: var(--sunk); }
.sn-sub .sn-rk { width: 1.6em; text-align: right; color: var(--muted); }
.sn-foot { margin-top: auto; padding: var(--s3) var(--s2) 0; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--muted); display: grid; gap: 2px; }

/* ページの骨組み */
main.page { max-width: var(--page); margin: 0 auto; padding: var(--s5) var(--s4) var(--s7); display: grid; gap: var(--s6); }
.split { display: grid; grid-template-columns: minmax(0, 1.618fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }
.split.rev { grid-template-columns: minmax(0, 1fr) minmax(0, 1.618fr); }
.stack { display: grid; gap: var(--s4); align-content: start; }
.stack.lg { gap: var(--s5); }
section.sec { display: grid; gap: var(--s4); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.sec-head p { color: var(--muted); font-size: var(--t-1); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s3); }
.card.flush { padding: 0; overflow: hidden; }
.side .card { padding: var(--s4); }
.crumb { display: flex; gap: var(--s2); align-items: center; font-size: var(--t-1); color: var(--muted); }
.crumb a { color: var(--muted); }

/* 見出しブロック */
.masthead { display: grid; gap: var(--s3); }
.masthead .title-row { display: flex; align-items: flex-end; gap: var(--s4); flex-wrap: wrap; }
.masthead h1 .us { color: var(--us); }
.masthead .lead { font-size: var(--t1); line-height: 1.7; color: var(--ink-2); max-width: 34em; }
.chips { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding-inline: 10px; border-radius: 999px; font-size: var(--t-1); font-weight: 500; background: var(--surface); border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.chip.solid { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.chip.us { background: var(--us); color: var(--us-ink); border-color: var(--us); }
.chip.them { background: var(--them-soft); color: var(--link); border-color: transparent; }
.chip.out { color: var(--muted); background: transparent; }
.chip.warn { border-color: var(--win); color: var(--win); }

/* 数字のタイル（そのページの要点になる数字だけ） */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }
.kpi { padding: var(--s4); display: grid; gap: var(--s1); align-content: start; border-left: 1px solid var(--rule); }
.kpi:first-child { border-left: 0; }
.kpi .k { font-size: var(--t-1); color: var(--muted); line-height: 1.5; }
.kpi .v { font-family: var(--f-num); font-weight: 600; font-size: var(--t4); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .v small { font-size: var(--t0); font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.kpi .v.us { color: var(--us); }
.kpi .v.them { color: var(--them); }
.kpi .note { font-size: var(--t-1); color: var(--muted); line-height: 1.5; }

/* 次の試合 */
.nextmatch { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--s5); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s4) var(--s5); position: relative; overflow: hidden; }
.nextmatch::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--us); }
.nextmatch .when .d { font-family: var(--f-num); font-weight: 600; font-size: var(--t4); line-height: 1; }
.nextmatch .when .v { color: var(--muted); font-size: var(--t-1); margin-top: var(--s2); }
.nextmatch .vs { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.nextmatch .vs .t { font-size: var(--t3); font-weight: 900; letter-spacing: .02em; }
.nextmatch .vs .t.us { color: var(--us); }
.nextmatch .vs a.t { color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--them); }
.nextmatch .vs .x { font-family: var(--f-num); color: var(--muted); font-size: var(--t1); }
.nextmatch .odds { text-align: right; }
.nextmatch .odds .p { font-family: var(--f-num); font-weight: 600; font-size: var(--t4); color: var(--us); line-height: 1; }
.nextmatch .odds .l { font-size: var(--t-1); color: var(--muted); max-width: 16em; margin-top: var(--s2); }

/* 勝ち上がりの道（相手ページへの入口） */
.road { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); counter-reset: step; }
.road .step { display: grid; gap: var(--s3); align-content: start; }
.road .step-h { display: flex; align-items: baseline; gap: var(--s2); padding-bottom: var(--s2); border-bottom: 2px solid var(--ink); }
.road .step-h .n { font-family: var(--f-num); font-weight: 700; font-size: var(--t2); line-height: 1; }
.road .step-h .r { font-weight: 700; }
.road .step-h .d { margin-left: auto; font-family: var(--f-num); font-size: var(--t-1); color: var(--muted); }
a.team-card { display: grid; gap: var(--s2); padding: var(--s4); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s; min-height: 44px; }
a.team-card:hover { border-color: var(--them); transform: translateY(-1px); }
a.team-card .nm { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
a.team-card .nm b { font-size: var(--t2); font-weight: 900; letter-spacing: .02em; }
a.team-card .nm .go { font-family: var(--f-num); color: var(--link); font-size: var(--t-1); font-weight: 600; letter-spacing: .08em; white-space: nowrap; }
a.team-card .sub { font-size: var(--t-1); color: var(--muted); }
a.team-card .form { font-size: var(--t-1); color: var(--ink-2); line-height: 1.6; }
a.team-card dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); margin: 0; padding-top: var(--s2); border-top: 1px solid var(--rule); }
a.team-card dt { font-size: 11px; color: var(--muted); }
a.team-card dd { margin: 0; font-family: var(--f-num); font-weight: 600; font-size: var(--t2); line-height: 1.1; }
a.team-card dd.us { color: var(--us); }
a.team-card.decided { background: transparent; }
a.team-card .out-note { padding-top: var(--s2); border-top: 1px solid var(--rule); color: var(--muted); font-size: var(--t-1); font-weight: 700; }
a.team-card.out { background: var(--sunk); }
a.team-card.out .nm b, a.team-card.out .form { color: var(--muted); }
a.team-card.out .nm .go { color: var(--muted); }

/* トーナメント表（公式の表と同じく、勝ち上がりは赤線） */
svg.bracket { width: 100%; height: auto; display: block; }
svg.bracket text { font-family: var(--f-ja); fill: var(--ink); }
svg.bracket .ln { stroke: var(--rule-strong); stroke-width: 1.5; fill: none; }
svg.bracket .ln.win { stroke: var(--win); stroke-width: 3; }
svg.bracket .ln.path { stroke: var(--us); stroke-width: 2; stroke-dasharray: 4 4; }
svg.bracket .mno { font-family: var(--f-num); font-size: 11px; font-weight: 600; fill: var(--ink-2); }
svg.bracket .mlab { font-family: var(--f-num); font-size: 11px; fill: var(--muted); }
svg.bracket .score { font-family: var(--f-num); font-size: 12px; font-weight: 700; fill: var(--win); }
svg.bracket .slot { font-family: var(--f-num); font-size: 11px; fill: var(--muted); }
svg.bracket .nm { font-size: 13.5px; font-weight: 700; }
svg.bracket .pct { font-family: var(--f-num); font-size: 11px; fill: var(--muted); }
svg.bracket .hit { fill: transparent; }
svg.bracket a:hover .hit { fill: var(--sunk); }
svg.bracket a:focus-visible .hit { stroke: var(--focus); stroke-width: 2; }
svg.bracket .me .hit { fill: var(--us-soft); }
svg.bracket .me .nm { fill: var(--us); }
svg.bracket .out .nm { fill: var(--muted); font-weight: 400; }
svg.bracket .dest { font-family: var(--f-num); font-weight: 700; font-size: 14px; fill: var(--ink); }

/* 日程 */
.sched { display: grid; }
.sched .r { display: grid; grid-template-columns: 55px 89px minmax(0, 1fr); gap: var(--s2); padding-block: var(--s3); border-top: 1px solid var(--rule); align-items: baseline; font-size: 13.5px; }
.sched .r:first-child { border-top: 0; padding-top: 0; }
.sched .r .m { font-family: var(--f-num); color: var(--muted); font-weight: 600; }
.sched .r .dt { font-family: var(--f-num); font-weight: 600; }
.sched .r .done { font-family: var(--f-num); font-weight: 700; color: var(--win); }
.sched .r.mine { font-weight: 700; }
.sched .r .where { display: block; color: var(--muted); font-size: var(--t-1); font-weight: 400; }

/* グラフ */
.figure { display: grid; gap: var(--s3); }
.figure .cap { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.legend { display: flex; gap: var(--s4); font-size: var(--t-1); color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.legend i.box { width: 10px; height: 10px; border: 0; border-radius: 2px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { font-family: var(--f-num); font-size: 12px; fill: var(--muted); }
svg.chart .grid line { stroke: var(--rule); stroke-width: 1; }
svg.chart .base { stroke: var(--rule-strong); stroke-width: 1; }
svg.chart .val { fill: var(--ink); font-weight: 600; }
svg.chart .lab-ja { font-family: var(--f-ja); font-size: 12.5px; fill: var(--ink-2); font-weight: 700; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--ground); font-size: var(--t-1); line-height: 1.55; padding: var(--s2) var(--s3); border-radius: 6px; white-space: nowrap; box-shadow: 0 5px 21px rgba(0,0,0,.18); }
.tip b { font-family: var(--f-num); font-weight: 600; }

/* 表 */
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: var(--s2) var(--s3); border-top: 1px solid var(--rule); vertical-align: top; line-height: 1.55; }
thead th { border-top: 0; background: var(--sunk); color: var(--muted); font-size: var(--t-1); font-weight: 500; white-space: nowrap; }
td.n, th.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.n { font-weight: 500; }
tr.hl td { background: var(--them-soft); font-weight: 700; }
tr.hl.us td { background: var(--us-soft); }
/* 結果: 勝ちは ○、負けは ×。形・文字・色の3つで区別する */
.res { font-weight: 700; white-space: nowrap; display: inline-flex; align-items: baseline; gap: 5px; color: var(--ink); }
.res .g { font-family: var(--f-ja); font-weight: 900; width: 1em; text-align: center; }
.res.w .g, .res.pkw .g { color: var(--us); }
.res.l, .res.pkl { color: var(--muted); font-weight: 500; }
.res.l .g, .res.pkl .g { color: var(--muted); }
.formstrip { display: inline-flex; gap: 3px; vertical-align: middle; }
.formstrip span { width: 22px; height: 22px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; border: 1px solid var(--rule); color: var(--ink-2); background: var(--surface); }
.formstrip span.w { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.formstrip span.d { background: var(--sunk); }
.formstrip span.l { color: var(--muted); }
.filters { display: flex; gap: var(--s1); flex-wrap: wrap; }
.filters button { font: inherit; font-size: 13px; min-height: 36px; padding-inline: var(--s3); border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }

/* 要点・注記・出典 */
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s3); }
/* 本文に太字などが混ざっても1つの段落として流れるよう、格子ではなく通常の流し込みにする */
.points li { position: relative; padding-left: 21px; max-width: var(--measure); }
.points li::before { content: ""; position: absolute; left: 6px; top: .72em; width: 8px; height: 8px; border-radius: 2px; background: var(--them); }
.points.us li::before { background: var(--us); }
.points b { font-weight: 700; }
.facts { margin: 0; display: grid; }
.facts > div { display: grid; grid-template-columns: 89px minmax(0, 1fr); gap: var(--s3); padding-block: var(--s3); border-top: 1px solid var(--rule); }
.facts > div:first-child { border-top: 0; padding-top: 0; }
.facts dt { font-size: var(--t-1); color: var(--muted); }
.facts dd { margin: 0; font-size: 13.5px; line-height: 1.65; }
.facts .src { display: block; font-size: var(--t-1); color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s2) var(--s4); margin: 0; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--f-num); font-weight: 500; font-size: var(--t0); }
.empty { color: var(--muted); font-size: 13.5px; }
details.more { border-top: 1px solid var(--rule); padding-top: var(--s3); }
details.more summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; list-style: none; gap: var(--s2); }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; font-family: var(--f-num); font-weight: 700; width: 21px; height: 21px; display: inline-grid; place-items: center; border: 1px solid var(--rule-strong); border-radius: 50%; font-size: 13px; }
details.more[open] summary::before { content: "−"; }
details.more .body { padding-block: var(--s3) var(--s4); display: grid; gap: var(--s3); }
.method { margin: 0; padding-left: 1.2em; display: grid; gap: var(--s2); color: var(--ink-2); font-size: 13.5px; max-width: 48em; }
.insight { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s2); padding: var(--s4); border-radius: var(--r); background: var(--surface); border: 1px solid var(--rule); }
.insight .h { font-weight: 700; font-size: var(--t1); line-height: 1.45; }
.insight .b { color: var(--ink-2); font-size: 13.5px; line-height: 1.7; }
.insight .fig { font-family: var(--f-num); font-weight: 600; font-size: var(--t3); line-height: 1; color: var(--us); }
.insights { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
/* 計算の手順（順番に意味があるので番号を振る） */
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: grid; gap: var(--s3); }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: var(--s3); row-gap: 2px; max-width: 40em; }
ol.steps li::before { content: counter(st); grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: var(--t1); background: var(--ink); color: var(--ground); }
ol.steps li b { font-weight: 700; }
ol.steps li span { color: var(--ink-2); font-size: 13.5px; line-height: 1.7; }
/* つながりの糸口 */
.conn-sum { display: grid; gap: var(--s2); }
.conn-bar { display: flex; gap: 2px; height: 13px; border-radius: 4px; overflow: hidden; background: var(--sunk); }
.conn-bar span { display: block; }
ol.chains { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); }
ol.chains li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: var(--s3); align-items: center; padding: var(--s2) var(--s3); border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
ol.chains .imp { font-weight: 700; font-size: var(--t1); text-align: center; color: var(--muted); }
ol.chains .imp.up { color: var(--us); }
ol.chains .imp.down { color: var(--link); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 16px; font-size: 13px; }
.chain .node { font-weight: 700; white-space: nowrap; }
.chain .node.me { color: var(--us); }
.chain .node.opp { color: var(--link); }
.chain .edge { display: inline-grid; justify-items: center; line-height: 1.25; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--sunk); white-space: nowrap; position: relative; }
.chain .edge::after { content: "→"; position: absolute; right: -13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; }
.chain .edge b { font-family: var(--f-num); font-weight: 600; font-size: 12.5px; }
.chain .edge small { font-size: 10.5px; color: var(--muted); }
.chain .edge.l b { color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--us); border-radius: 4px; }
/* 前後のページ: ページの上に細い1行で置く（見出しとの間は詰める） */
.pager { display: flex; justify-content: space-between; gap: var(--s3); margin-bottom: calc(var(--s3) - var(--s6)); }
.pager a { display: inline-flex; align-items: center; gap: var(--s2); min-height: 44px; padding-inline: var(--s3); border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); text-decoration: none; color: var(--ink); font-size: 13.5px; min-width: 0; }
.pager a:hover { border-color: var(--them); }
.pager a .l { font-size: var(--t-1); color: var(--muted); white-space: nowrap; }
.pager a b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pager a.next { flex-direction: row-reverse; margin-left: auto; }
footer.foot { max-width: var(--page); margin: 0 auto; padding: 0 var(--s4) var(--s6); color: var(--muted); font-size: var(--t-1); }

/* ここまでの結果 */
ul.done-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
ul.done-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: var(--s3); align-items: baseline; padding: var(--s3) var(--s4); border-top: 1px solid var(--rule); }
ul.done-list li:first-child { border-top: 0; }
ul.done-list li.mine { background: var(--us-soft); }
ul.done-list li.rlab { display: block; padding: var(--s2) var(--s4); background: var(--sunk); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; }
ul.done-list .t { color: var(--muted); }
ul.done-list .t.win { color: var(--ink); font-weight: 700; }
ul.done-list .sc { font-size: var(--t1); }
@media (max-width: 560px) { ul.done-list li { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); } ul.done-list li .small { grid-column: 1 / -1; } }

/* 当たる確率の内訳（入口ページの勝ち上がりの道） */
.result-banner { display: flex; align-items: baseline; gap: var(--s2); padding: var(--s2) var(--s3); border-radius: var(--r); background: var(--sunk); }
.result-banner.won { background: var(--us-soft); }
.result-banner .num { font-size: var(--t1); font-weight: 700; }
.meet { display: grid; gap: 6px; }
.meetbar { display: flex; gap: 2px; height: 13px; border-radius: 4px; overflow: hidden; }
.meetbar span { display: block; min-width: 2px; }
.meetbar .lose, .meetlist i.lose { background: repeating-linear-gradient(135deg, var(--sunk) 0 4px, var(--rule) 4px 6px); }
.meetlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12.5px; line-height: 1.5; }
.meetlist li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 8px; align-items: start; }
.meetlist i { width: 10px; height: 10px; border-radius: 2px; margin-top: 5px; }
.meetlist b { font-weight: 700; }
.meetlist small { display: block; color: var(--muted); font-size: 11.5px; }

/* 2次予選の強豪 */
.meter.them i { background: var(--them); }
table.rank td.nm a { font-weight: 700; }
table.rank th button.sort { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 28px; }
table.rank th button.sort::after { content: "↕"; font-size: 10px; opacity: .45; }
table.rank th button.sort[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
table.rank th button.sort[aria-pressed="true"]::after { content: "↓"; opacity: 1; }
.totcell { display: grid; grid-template-columns: 2.6em 5em; gap: 8px; align-items: center; }
details.seed { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); scroll-margin-top: 70px; }
details.seed[open] { border-color: var(--rule-strong); }
details.seed > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); min-height: 55px; }
details.seed > summary::-webkit-details-marker { display: none; }
details.seed > summary:hover { background: var(--sunk); }
details.seed .rk { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--t1); background: var(--them-soft); color: var(--link); }
details.seed[open] .rk { background: var(--them); color: var(--surface); }
details.seed .nm { display: grid; line-height: 1.35; min-width: 0; }
details.seed .nm b { font-size: var(--t1); font-weight: 900; letter-spacing: .02em; }
details.seed .tot, details.seed .vs { font-weight: 600; font-size: var(--t2); line-height: 1; text-align: right; display: grid; justify-items: end; gap: 3px; }
details.seed .tot small, details.seed .vs small { font-family: var(--f-ja); font-size: 11px; font-weight: 500; color: var(--muted); }
details.seed .vs { color: var(--us); min-width: 5.5em; }
.seed-in { display: grid; gap: var(--s4); padding: var(--s3) var(--s4) var(--s4); border-top: 1px solid var(--rule); }
.seed-body { display: grid; grid-template-columns: minmax(0, 1.618fr) minmax(0, 1fr); gap: var(--s4); align-items: start; }
.seed-body .card { padding: var(--s3) var(--s4); gap: var(--s2); }
.part { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) 2em 2.6em; gap: 8px; align-items: center; font-size: 13px; }
.part .num { text-align: right; font-weight: 600; }
.part .r { font-size: 11px; text-align: right; }
nav.toc { display: flex; gap: var(--s2); flex-wrap: wrap; }
nav.toc a { display: inline-flex; align-items: center; min-height: 36px; padding-inline: var(--s3); border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink-2); text-decoration: none; font-size: 13.5px; }
nav.toc a:hover { border-color: var(--them); color: var(--ink); }
section.sec[id] { scroll-margin-top: 70px; }
.tags { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; min-height: 20px; padding-inline: 7px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--them-soft); color: var(--link); white-space: nowrap; }
.tag.warn { background: transparent; border: 1px solid var(--win); color: var(--win); }
.tag.first { background: var(--sunk); color: var(--ink-2); font-weight: 500; }
.tag.first.me { background: var(--us-soft); color: var(--us); font-weight: 700; }
.tag.club { background: transparent; color: var(--muted); font-weight: 500; border: 1px solid var(--rule); }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.rule { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s3) var(--s4); display: grid; gap: var(--s2); align-content: start; }
.rule.open { border-style: dashed; }
.rh { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.rh b { font-weight: 700; line-height: 1.45; }
.rule .no { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--ground); font-weight: 700; flex: none; }
.rule .chip { margin-left: auto; }
.exwhy { display: grid; gap: var(--s2); padding: var(--s3) var(--s4); background: var(--them-soft); border-radius: var(--r); }
.exwhy .points li { max-width: none; font-size: 13.5px; }
.exwhy .points li.muted::before { background: var(--rule-strong); }
.tlgrid, .frgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--s3); align-items: start; }
.frgrid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.tlc, .frb { padding: var(--s3); gap: var(--s2); }
.tlc h3 { font-size: var(--t0); }
.tlc h3 small { font-weight: 500; color: var(--muted); font-size: var(--t-1); }
ol.tl { margin: 0; padding: 0; list-style: none; display: grid; }
ol.tl li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; gap: 6px; align-items: center; padding-block: 3px; border-top: 1px solid var(--rule); font-size: 13px; }
ol.tl li:first-child { border-top: 0; }
ol.tl li .rk { color: var(--muted); text-align: right; }
ol.tl li.seed .tm { font-weight: 700; }
ol.tl li.club .tm, ol.tl li.sub .tm { color: var(--muted); }
.frb.mine { border-color: var(--us); box-shadow: inset 0 0 0 1px var(--us); }
.frh { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.frh .small { margin-left: auto; }
.frb ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; font-size: 13px; }
.frb li { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.frb li.out { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.frb li.me { color: var(--us); font-weight: 700; }
table.tourn td { white-space: nowrap; }
table.tourn td.top { font-weight: 700; color: var(--ink); }
table.tourn .ex { display: block; font-size: 10.5px; color: var(--link); font-weight: 500; }

/* 画面幅ごとの組み替え */
@media (max-width: 1280px) { .brand span { display: none; } }
@media (max-width: 1000px) {
  nav.pages { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: thin; padding-bottom: var(--s2); }
  .split, .split.rev { grid-template-columns: minmax(0, 1fr); }
  .road { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .nextmatch { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
  .nextmatch .odds { text-align: left; }
  .insights { grid-template-columns: minmax(0, 1fr); }
  .seed-body { grid-template-columns: minmax(0, 1fr); }
  .rules { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  details.seed > summary { grid-template-columns: 34px minmax(0, 1fr) auto; padding-inline: var(--s3); }
  details.seed .vs { display: none; }
  .seed-in { padding-inline: var(--s3); }
}
@media (max-width: 560px) {
  h1 { font-size: var(--t3); }
  .kpi .v { font-size: var(--t3); }
  main.page { padding-inline: var(--s3); gap: var(--s5); }
  .topbar .in { padding-inline: var(--s3); }
  .brand span { display: none; }
  .pager a b { max-width: 9em; }
  .pager { margin-bottom: calc(var(--s2) - var(--s5)); }
}

/* ブロック決勝の分析（結論・解剖・勝ち筋・警戒） */
.sec.verdict, .sec.review { background: var(--surface); border: 1px solid var(--rule); border-left: 5px solid var(--us); border-radius: var(--r); padding: var(--s4) var(--s5); }
.vline { font-size: var(--t2); font-weight: 900; line-height: 1.45; letter-spacing: .01em; text-wrap: balance; }
.prose.hi { background: var(--us-soft); border-radius: var(--r); padding: var(--s3) var(--s4); font-weight: 700; max-width: none; }
a.srclink { font-size: 11px; white-space: nowrap; }
.blk { display: block; margin-top: 3px; }
.yr { font-family: var(--f-num); font-size: 11px; color: var(--muted); margin-left: 6px; }
td.q { color: var(--ink-2); font-size: 12.5px; max-width: 34em; }

.myths { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--s3); }
.myth { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s3) var(--s4); display: grid; gap: var(--s2); align-content: start; }
.myth .mh { display: grid; gap: 4px; }
.myth .mh b { color: var(--muted); font-weight: 500; text-decoration: line-through; text-decoration-thickness: 1px; line-height: 1.5; }
.myth .mr { display: grid; gap: 2px; padding-top: var(--s2); border-top: 1px solid var(--rule); }
.myth .mr b { font-size: var(--t1); line-height: 1.4; }
.num.big { font-family: var(--f-num); font-weight: 600; font-size: var(--t3); line-height: 1; color: var(--us); }

ul.clock { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
ul.clock li { display: grid; grid-template-columns: 6em minmax(0, 1fr) minmax(0, 1.2fr); gap: var(--s3); align-items: baseline; padding: var(--s3) var(--s4); background: var(--surface); }
ul.clock li b { font-size: var(--t1); color: var(--us); }

ol.plan { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s3); counter-reset: none; }
ol.plan li { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: var(--s3); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s4); }
ol.plan .no { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--us); color: var(--us-ink); font-weight: 700; font-size: var(--t2); }
ol.plan li > div > b { font-size: var(--t1); line-height: 1.45; display: block; margin-bottom: var(--s2); }
ol.plan .ev { margin: var(--s2) 0 0; padding: var(--s2) 0 0; border-top: 1px dashed var(--rule); list-style: none; display: grid; gap: 3px; }
ol.plan .ev li { display: block; padding: 0; border: 0; background: none; font-family: var(--f-num); font-size: 12px; color: var(--muted); }
ol.plan .ev li::before { content: "根拠 "; font-family: var(--f-ja); }

6点上でした。いちばん勝てる可能性が高かった試合で、いちばん大きな点差で負けたことになります。\n\n城東は今季のT5リーグで7試合11得点、同格以上の相手からは1試合0.90点しか取れていないチームでした。その城東が、同格の武蔵丘から3点を取った。「格下相手の大量点で数字が膨らんでいるだけ」という読みは、この90分に関しては外れました。", "points": ["武蔵丘のブロック決勝級はこれで6試合0勝6敗、2得点11失点。うち5試合が無得点で、この日も無得点だった", "相手との点差15点は、その6試合でいちばん小さい。条件としてはいちばん恵まれていた", "城東の強さの点数はこの勝利で1712→1786（+74）に上がり、308校中59位に。武蔵丘は1697→1623（-74）", "戦前の見込みは武蔵丘48%・城東52%。試合後の点数で計算し直すと37%で、モデルは城東を74点ぶん低く見ていた", "城東は選手権のブロック決勝に4回目の挑戦で初めて勝ち、2次予選に進んだ。過去3回はいずれも無得点だった", "この試合の得点者・時間帯を報じた記事は無い"]}}, "upsetsNote": "「勝つ見込み」は、試合の時点での両校の強さの点数から計算した値。これが低いほど番狂わせが大きい。PK戦の決着は90分が引き分けなので、印をつけて分けている。どちらかの学校の試合数が5試合に満たないものは、点数のぶれが大きいため外した。", "postmortem": {"title": "ブロック決勝の答え合わせ", "lead": "試合の前に7つの勝ち筋と5つの警戒を書きました。結果が出たので、どれが当たり、どれが外れたかを残しておきます。城東サッカー部の公式サイトに前後半の内訳が載っており、前半2-0・後半1-0だったことが分かりました。これが答え合わせの鍵になります。", "verdictLine": "勝ち筋はほぼ全部外れ、警戒の1番目だけが当たりました。", "keys": [{"n": "1", "t": "先制点を取る", "v": "×", "r": "取れなかった。それどころか前半だけで2失点している。城東は「リードしたら自陣でボールを回して時間を使う」チームで、前半のうちにその展開に持ち込まれた"}, {"n": "2", "t": "CKのセカンドボールを狙う", "v": "—", "r": "無得点に終わったため、成否を判定できない。城東の守備がこの日も崩れなかったのか、そもそもその形を作れなかったのかは、記録が無いので分からない"}, {"n": "3", "t": "無理に前に出ない。カウンターが城東の本体", "v": "×", "r": "3失点した。追いかける展開では前に出るしかなく、城東の速いカウンターという読み自体は正しくても、そこに付け込まれない試合運びはできなかった"}, {"n": "4", "t": "後半25分以降に集中を上げる", "v": "×", "r": "完全に外れた。城東が今季のリーグで1-0勝ちした2試合の得点時間は後半34分と後半25分で、「前半に点が入らないチーム」と読んでいた。この試合は前半2-0。城東はこれまでと違う入り方をしてきたか、武蔵丘の立ち上がりが持たなかったか、そのどちらかだった"}, {"n": "5", "t": "打ち合いに乗らない", "v": "△", "r": "打ち合いにはならなかった。ただし前半で2点を追う展開になった時点で、望んだ「0-0か1-0の静かな試合」は消えていた"}, {"n": "6", "t": "学習院戦の1-0をもう一度やる", "v": "×", "r": "再現できなかった。学習院は今季6試合2得点の、点が取れない相手だった。城東は違った"}, {"n": "7", "t": "PK戦になっても分は悪くない", "v": "—", "r": "PK戦に到達しなかった"}], "missed": [{"claim": "城東は同格以上の相手から1試合0.90点しか取れない", "fact": "同格の武蔵丘から3点を取った"}, {"claim": "城東はヤマ場17試合で4勝13敗", "fact": "5勝目を、この試合で挙げた"}, {"claim": "城東は選手権のブロック決勝に3回出て3回とも無得点", "fact": "4回目で3得点。初めてこの舞台を突破した"}, {"claim": "城東の得点の75%は格下からの大勝で、実力の近い相手からは取れない", "fact": "今季のT5で7試合11得点だったチームが、同格から1試合3点を取った"}, {"claim": "城東の時計は後半25分以  "s": "選手権 ブロック決勝", "r": "0-3 城東", "gap": "+15"}], "sting": "今年の城東戦は、6回のうち相手との差がいちばん小さい試合でした（15点差）。2022年の日大二は118点上、2024年の城北は266点上。いちばん勝てる可能性が高かった年に、いちばん大きな点差で負けたことになります。"}, "bright": {"title": "それでも、この5年で確かに上がった", "points": ["学習院(1747)は、武蔵丘がこの5年で完封した7試合のなかで<b>最も強い相手</b>だった。それまでの最高は2022年の豊多摩(1566)で、しかもそれは0-0の引き分け。勝ち切って完封した相手としては、断然の1位になる", "強さの点数は最低1422（2023年度）から最高1697（2026年度）まで、275点上がった", "90分で格上を倒したのは5年で2回だけ。2024年の中大杉並（112点上）と、今年の学習院（107点上）", "選手権は通算13試合8勝5敗、34得点18失点。3つの大会のなかで最も勝率が高く、失点も少ない。秋に強いチームであることは数字に出ている", "今季のNSリーグ2部Aは4勝1分0敗の無敗首位。12得点4失点で、リーグ戦でも数字が安定していた"]}}, "thisYear": {"title": "数字で見る今大会", "rows": [{"k": "戦績", "v": "3試合 2勝1敗", "n": "得点6・失点5"}, {"k": "倒した相手の強さ", "v": "平均1570", "n": "昭和第一1392・学習院1747。同じ山の城東は平均1428の相手を倒して上がってきた"}, {"k": "点数の動き", "v": "1551 → 1697 → 1623", "n": "シーズン開始 → 学習院戦の直後（5年間の最高値）→ ブロック決勝のあと"}, {"k": "順位", "v": "308校中103位", "n": "学習院戦の直後は82位まで上げていた"}, {"k": "完封", "v": "2試合", "n": "総体の富士戦と、選手権2回戦の学習院戦"}, {"k": "番狂わせ", "v": "1件", "n": "学習院戦。東京の1次予選で90分決着した番狂わせ26件のうち11番目"}]}, "upsetsHighlight": "2回戦で起きた番狂わせに限れば、武蔵丘の学習院戦が1位です。90分決着の26件は1回戦14件・2回戦5件・ブロック決勝7件で、勝ち上がるほど番狂わせは起きにくくなります。その2回戦で、最も見込みの低い側が勝ったのがこの試合でした。", "outside": {"title": "外から見た武蔵丘", "lead": "武蔵丘の試合について書かれたものが世の中にどれだけあるか、記事・掲示板・SNS・各校の公式サイトを当たりました。結論から言うと、戦い方や試合内容を記した文章は1件も見つかりませんでした。数字だけが残っています。", "items": [{"k": "城東サッカー部 公式サイト", "date": "2026/9/23", "v": "ブロック決勝の前後半の内訳。前半2-0・後半1-0で城東の3-0。得点者3名の記載あり。試合展開やコメントは無く、スコア表の1行のみ。写真は掲載されている", "src": "https://johtoh-fc-2021.jimdofree.com/"}, {"k": "学習院高等科サッカー部 公式サイト", "date": "2026/9/20", "v": "「本日の試合は都立武蔵丘高校と対戦しましたが、0ー1で敗戦しました。」— これが全文。相手の評価も得点経緯も書かれていない", "src": "https://ghsc1957.com/news/"}, {"k": "東京サッカーBBS 第5地区板", "date": "2026/9/15〜9/23", "v": "3試合すべての結果が書き込まれている。ただし全投稿がスコアと会場・キックオフ時刻の羅列で、論評や観戦記の文化が無い板だった", "src": "https://www.kawakitanet.com/soccerbbs/j/select.php?t_id=1783"}, {"k": "高校サッカードットコム", "date": "2026/9/20・9/22", "v": "その日の総括ニュース記事に武蔵丘の名前は無い。学習院を倒した試合も、番狂わせとして取り上げられてはいない。応援メッセージ欄の2026年度分は9/8の1件だけ", "src": "https://koko /* ---------- 共通: 強さの点数の推移（折れ線） ---------- */
function eloChart(series) {
  // series: [{name, hist, color, dash}]  2本まで。線の端に名前を直接書き、色だけに頼らない
  const W = 620, H = 260, L = 44, R = 110, TOP = 18, BOT = 34;
  const years = ["2022", "2023", "2024", "2025", "2026"];
  const vals = series.flatMap((sr) => years.map((y) => sr.hist[y]).filter((v) => v != null));
  const lo = Math.floor((Math.min(...vals, 1500) - 30) / 50) * 50, hi = Math.ceil((Math.max(...vals, 1500) + 30) / 50) * 50;
  const x = (i) => L + (i * (W - L - R)) / (years.length - 1), y = (v) => TOP + ((hi - v) * (H - TOP - BOT)) / (hi - lo);
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "強さの点数の年度ごとの推移" });
  const g = s("g", { class: "grid" });
  for (let v = lo; v <= hi; v += 50) { g.append(s("line", { x1: L, x2: W - R, y1: y(v), y2: y(v) })); svg.append(s("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" }, v)); }
  svg.append(g);
  svg.append(s("line", { x1: L, x2: W - R, y1: y(1500), y2: y(1500), stroke: "var(--muted)", "stroke-dasharray": "2 4", "stroke-width": 1 }));
  svg.append(s("text", { x: L + 4, y: y(1500) - 5 }, "全体の平均 1500"));
  years.forEach((yr, i) => svg.append(s("text", { x: x(i), y: H - 10, "text-anchor": "middle" }, `${yr}年度`)));
  const ends = [];
  for (const sr of series) {
    const pts = years.map((yr, i) => [x(i), sr.hist[yr]]).filter((p) => p[1] != null).map(([px, v]) => [px, y(v), v]);
    svg.append(s("polyline", { points: pts.map((p) => p[0] + "," + p[1]).join(" "), fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-dasharray": sr.dash ? "6 4" : null }));
    pts.forEach((p, i) => svg.append(s("circle", { cx: p[0], cy: p[1], r: i === pts.length - 1 ? 5 : 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2 })));
    const last = pts[pts.length - 1];
    ends.push({ y: last[1], v: last[2], name: sr.name });
  }
  ends.sort((a, b) => a.y - b.y);
  if (ends.length === 2 && ends[1].y - ends[0].y < 34) { const m = (ends[0].y + ends[1].y) / 2; ends[0].y = m - 17; ends[1].y = m + 17; }
  for (const e of ends) { svg.append(s("text", { x: W - R + 12, y: e.y - 2, class: "lab-ja" }, e.name)); svg.append(s("text", { x: W - R + 12, y: e.y + 14, class: "val" }, e.v)); }
  const cross = s("line", { y1: TOP, y2: H - BOT, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const hit = s("rect", { x: L, y: TOP, width: W - L - R, height: H - TOP - BOT, fill: "transparent" });
  hit.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) * W) / r.width;
    const i = Math.max(0, Math.min(years.length - 1, Math.round((px - L) / ((W - L - R) / (years.length - 1)))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    showTip(ev, `${years[i]}年度の終わり<br>` + series.map((sr) => `${sr.name} <b>${sr.hist[years[i]] ?? "―"}</b>`).join("<br>"));
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  svg.append(hit);
  return svg;
}

function curveFigure() {
  // 点数の差（武蔵丘 − 相手）と、武蔵丘が勝つ見込みの関係。この山の相手の位置を点で示す
  const W = 620, H = 250, L = 44, R = 20, TOP = 16, BOT = 40, X0 = -250, X1 = 250;
  const x = (d) => L + ((d - X0) * (W - L - R)) / (X1 - X0), y = (p) => TOP + (1 - p) * (H - TOP - BOT);
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "点数の差と勝つ見込みの関係" });
  for (const p of [0, 0.25, 0.5, 0.75, 1]) { svg.append(s("line", { x1: L, x2: W - R, y1: y(p), y2: y(p), stroke: "var(--rule)" })); svg.append(s("text", { x: L - 8, y: y(p) + 4, "text-anchor": "end" }, Math.round(p * 100) + "%")); }
  for (let d = X0; d <= X1; d += 50) svg.append(s("text", { x: x(d), y: H - 20, "text-anchor": "middle" }, (d > 0 ? "+" : "") + d));
  svg.append(s("text", { x: (L + W - R) / 2, y: H - 3, "text-anchor": "middle" }, "点数の差（武蔵丘 − 相手）"));
  svg.append(s("line", { x1: x(0), x2: x(0), y1: TOP, y2: H - BOT, stroke: "var(--rule-strong)", "stroke-dasharray": "2 4" }));
  const pts = [];
  for (let d = X0; d <= X1; d += 5) pts.push(`${x(d)},${y(winP(d))}`);
  svg.append(s("polyline", { points: pts.join(" "), fill: "none", stroke: "var(--ink-2)", "stroke-width": 2 }));
  const opps = D.elo.opponents.slice().sort((a, b) => a.diff - b.diff);
  opps.forEach((o, i) => {
    const cx = x(Math.max(X0, Math.min(X1, o.diff))), cy = y(winP(o.diff));
    svg.append(s("circle", { cx, cy, r: 5, fill: "var(--them)", stroke: "var(--surface)", "stroke-width": 2 }));
    const above = i % 2 === 0;
    svg.append(s("text", { x: cx, y: above ? cy - 12 : cy + 20, "text-anchor": "middle", class: "lab-ja" }, `${o.name} ${pct(winP(o.diff))}`));
    const hit = s("circle", { cx, cy, r: 14, fill: "transparent" });
    hit.addEventListener("mousemove", (ev) => showTip(ev, `${o.name}<br>点数の差 <b>${o.diff > 0 ? "+" : ""}${o.diff}</b><br>武蔵丘が勝つ見込み <b>${pct(winP(o.diff))}</b>`));
    hit.addEventListener("mouseleave", hideTip);
    svg.append(hit);
  });
  return h("div", { class: "figure" }, h("div", { class: "cap" }, h("h3", {}, "点数の差と勝つ見込み"), h("div", { class: "legend" }, h("span", {}, h("i", { class: "box", style: "background:var(--them)" }), "この山の相手"))), svg);
}

function goalsChartSection(t) {
  const years = Object.keys(t.byYear).sort();
  const W = 620, H = 250, L = 40, R = 16, TOP = 16, BOT = 34;
  const vmax = Math.ceil(Math.max(...years.flatMap((y) => [t.byYear[y].gfPer, t.byYear[y].gaPer])) + 0.5);
  const band = (W - L - R) / years.length, bw = Math.min(28, band * 0.28);
  const y = (v) => TOP + ((vmax - v) * (H - TOP - BOT)) / vmax;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "年度ごとの1試合平均の得点と失点" });
  for (let v = 0; v <= vmax; v += 1) { svg.append(s("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--rule-strong)" : "var(--rule)" })); svg.append(s("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" }, v)); }
  years.forEach((yr, i) => {
    const cx = L + band * i + band / 2, d = t.byYear[yr];
    const bar = (x0, v, col) => (v < 0.15 ? s("g") : s("path", { d: `M${x0},${y(0)} V${y(v) + 4} a4,4 0 0 1 4,-4 h${bw - 8} a4,4 0 0 1 4,4 V${y(0)} z`, fill: col }));
    const xa = cx - bw - 1, xb = cx + 1;
    svg.append(bar(xa, d.gfPer, "var(--us)"), bar(xb, d.gaPer, "var(--them)"));
    svg.append(s("text", { x: xa + bw / 2, y: y(d.gfPer) - 6, "text-anchor": "middle", class: "val" }, d.gfPer.toFixed(1)));
    svg.append(s("text", { x: xb + bw / 2, y: y(d.gaPer) - 6, "text-anchor": "middle" }, d.gaPer.toFixed(1)));
    svg.append(s("text", { x: cx, y: H - 12, "text-anchor": "middle" }, `${yr}年度`));
    const hit = s("rect", { x: cx - band / 2, y: TOP, width: band, height: H - TOP - BOT, fill: "transparent" });
    hit.addEventListener("mousemove", (ev) => showTip(ev, `${yr}年度（${d.n}試合）<br>得点 <b>${d.gfPer}</b>／試合<br>失点 <b>${d.gaPer}</b>／試合<br>${d.w}勝 ${d.pkw}PK勝 ${d.pkl}PK負 ${d.l}敗`));
    hit.addEventListener("mouseleave", hideTip);
    svg.append(hit);
  });
  return h("section", { class: "sec" }, h("div", { class: "figure" },
    h("div", { class: "cap" }, h("h2", {}, "年度ごとの得点と失点"), h("div", { class: "legend" }, h("span", {}, h("i", { class: "box", style: "background:var(--us)" }), "1試合平均の得点"), h("span", {}, h("i", { class: "box", style: "background:var(--them)" }), "1試合平均の失点"))),
    svg, h("p", { class: "small muted" }, "2026年度は総体の2試合だけです。")));
}

    h("p", { class: "lead" }, `1次予選を勝ち上がった34校と、1次予選を免除された33校。合わせて${S.nTeams}校が10月から都大会を戦います。`
      + "武蔵丘はここに届きませんでしたが、倒した相手と倒された相手がどこまで行くのかは、この表で追えます。"),
    h("p", { class: "lead" }, "強さの点数から、1試合ずつの勝つ見込みを掛け合わせて、山を勝ち抜く確率と優勝確率を出しました。")));

  const top = S.teams.slice(0, 3);
  root.append(h("div", { class: "kpis" },
    ...top.map((t, i) => h("div", { class: "kpi" },
      h("span", { class: "k" }, `優勝確率 ${i + 1}位`),
      h("span", { class: "v" + (i ? "" : " us") }, pct(t.title, 1)),
      h("span", { class: "note" }, `${nm(t.key)}（点数 ${t.elo}・第${t.block}ブロック）`))),
    (() => { const j = S.teams.find((x) => x.key === "城東"); if (!j) return null;
      return h("div", { class: "kpi" }, h("span", { class: "k" }, "武蔵丘を倒した城東"),
        h("span", { class: "v them" }, `${j.rank}位`, h("small", {}, `/${S.nTeams}`)),
        h("span", { class: "note" }, `点数 ${j.elo}・第${j.block}ブロック。山を勝ち抜く見込みは ${pct(j.blockWin, 2)}で、同じ山に実践学園と帝京がいる`)); })()));

  const main = h("div", { class: "stack lg" });

  // 出場校ランキング
  const max = S.teams[0].title;
  main.append(h("section", { class: "sec", id: "rank" },
    h("div", { class: "sec-head" }, h("h2", {}, "出場校ランキング"), h("p", {}, `${S.nTeams}校を強さの点数の順に`)),
    h("div", { class: "tbl" }, h("table", { class: "rank" },
      h("thead", {}, h("tr", {}, h("th", { class: "n" }, "#"), h("th", {}, "学校"), h("th", { class: "n" }, "点数"),
        h("th", { class: "n" }, "山"), h("th", {}, "山を勝ち抜く"), h("th", { class: "n" }, "優勝"))),
      h("tbody", {}, S.teams.map((t) => h("tr", { class: t.key === "城東" ? "hl" : null },
        h("td", { class: "n" }, t.rank),
        h("td", { class: "nm" }, nm(t.key), t.key === "城東" ? h("span", { class: "tag" }, "武蔵丘を破った") : null),
        h("td", { class: "n" }, t.elo),
        h("td", { class: "n" }, t.block),
        h("td", {}, h("div", { class: "totcell" }, h("span", { class: "num" }, pct(t.blockWin, 1)),
          h("div", { class: "meter them" }, h("i", { style: `width:${Math.min(100, t.blockWin * 100)}%` })))),
        h("td", { class: "n" }, t.title >= 0.001 ? pct(t.title, 1) : "―")))))),
    h("p", { class: "small muted prose" }, "「山を勝ち抜く」はその4分の1の山で勝ち残る見込み、「優勝」は準決勝・決勝まで勝ち切る見込みです。"
      + "1試合ごとの見込みを掛け合わせたもので、組み合わせの運がそのまま数字に出ます。点数が高くても山が厳しければ優勝確率は下がります。")));

  // ブロックごとの1回戦
  const byBlock = {};
  for (const p of S.firstRound) (byBlock[p.block] = byBlock[p.block] || []).push(p);
  main.append(h("section", { class: "sec", id: "draw" },
    h("div", { class: "sec-head" }, h("h2", {}, "1回戦の組み合わせ"), h("p", {}, "4つの山・左の数字はその校が勝つ見込み")),
    h("div", { class: "blocks" }, Object.keys(byBlock).map((b) => h("div", { class: "blk" },
      h("h3", {}, `第${b}ブロック`),
      h("ul", { class: "draw" }, byBlock[b].map((p) => h("li", { class: p.a === "城東" || p.b === "城東" ? "mine" : null },
        p.b
          ? [h("span", { class: "t" + (p.p >= 0.5 ? " win" : "") }, nm(p.a)), h("b", { class: "num" }, pct(p.p)),
             h("span", { class: "t" + (p.p < 0.5 ? " win" : "") }, nm(p.b))]
          : [h("span", { class: "t win" }, nm(p.a)), h("b", { class: "num" }, "―"), h("span", { class: "small muted" }, "1回戦なし")]))))))));

  const side = h("aside", { class: "stack side" });
  const blkTop = {};
  for (const t of S.teams) if (!blkTop[t.block] || t.blockWin > blkTop[t.block].blockWin) blkTop[t.block] = t;
  side.append(h("div", { class: "card" }, h("h2", {}, "山ごとの本命"),
    h("dl", { class: "kv" }, Object.keys(blkTop).flatMap((b) => [h("dt", {}, `第${b}ブロック`), h("dd", {}, `${nm(blkTop[b].key)} ${pct(blkTop[b].blockWin, 1)}`)]))));
  side.append(h("div", { class: "card" }, h("h2", {}, "この数字の読み方"),
    h("ul", { class: "points" },
      h("li", {}, "強さの点数は、過去5年の公式戦4,040試合と今季のリーグ戦から計算したもの。2次予選に出る67校は、1次予選を戦った学校より試合数が多く、点数の精度も高い"),
      h("li", {}, "優勝確率を足すと100%になります。山の組み合わせを1試合ずつ掛け合わせているためです"),
      h("li", {}, "会場・日程・けが人・当日のメンバーは入っていません。あくまで過去の結果からの目安です"))));
  root.append(h("div", { class: "split" }, main, side));
}
